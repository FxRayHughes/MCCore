plugins {
    id 'java-library'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.rit.sucy'
version = '3.0.0'

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/') }
    maven { url = uri('https://repo.md-5.net/content/repositories/snapshots/') }
}

dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT'
    api 'com.zaxxer:HikariCP:4.0.3'
    api 'org.xerial:sqlite-jdbc:3.36.0.3'
    api 'com.fasterxml.jackson.core:jackson-databind:2.13.5'
    api 'com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:2.13.5'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.spigotmc:spigot-api:1.12.2-R0.1-SNAPSHOT'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
    main.java.srcDirs = ['src']
    test.java.srcDirs = ['test']
    main.resources.srcDirs = ['config']
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    filesMatching('plugin.yml') {
        expand(version: project.version)
    }
}

shadowJar {
    archiveClassifier = ''
    relocate 'com.zaxxer.hikari', 'com.rit.sucy.internal.hikari'
    relocate 'org.sqlite', 'com.rit.sucy.internal.sqlite'
    relocate 'com.fasterxml.jackson', 'com.rit.sucy.internal.jackson'
    relocate 'org.yaml.snakeyaml', 'com.rit.sucy.internal.snakeyaml'
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

test {
    useJUnit()
}
